# CI for NutriScan (ADR 0023). One workflow for the MVP; per-layer path
# filters come after the demo. Every job here is a required status check
# on main (CONTRIBUTING §2).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PRs only, so every commit on main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fvmrc:
    name: fvmrc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check .fvmrc constraints (ADR 0025)
        run: python3 .github/scripts/check_fvmrc.py .fvmrc

  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check commit messages (CONTRIBUTING §3)
        run: >-
          python3 .github/scripts/check_commits.py
          ${{ github.event.pull_request.base.sha }}
          ${{ github.event.pull_request.head.sha }}

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" gitleaks
      - name: Scan the full git history for secrets
        run: ./gitleaks git --redact --no-banner .

  flutter:
    name: flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: flutter --version
      - name: Install dependencies from the committed lockfile
        run: flutter pub get --enforce-lockfile
      - name: Generated localizations match the ARB files
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/generated
      - run: flutter analyze
      - run: flutter test
