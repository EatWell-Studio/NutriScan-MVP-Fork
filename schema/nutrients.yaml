# Nutrient fields: the single source of truth for nutrient keys (PRD §8 rule 1,
# ADR 0005). Dart and Python code is generated from this file (C-4); never
# duplicate these definitions by hand.
#
# Shared contract: change only in a dedicated PR (CONTRIBUTING §2). Keys are
# never renamed or removed once data exists; add a new key instead.
#
# Per nutrient:
#   key           internal key: snake_case with a unit suffix (ADR 0005)
#   unit          unit of the stored value per 100 g or per 100 ml
#   label_de      wording on German labels, Regulation (EU) No 1169/2011 Annex XV
#                 (null if the nutrient is not part of the EU label)
#   label_order   position in the German label order used by the confirm screen
#                 (PRD §5); energy_kj and energy_kcal share one label line
#   parent        key of the line a "davon" sub-item belongs to; validation
#                 requires child <= parent (DEV_PLAN 3.3)
#   core          shown expanded on the confirm screen; the rest is folded (PRD §5)
#   mass_balance  counted in the "sum <= 100 g" check (DEV_PLAN 3.3)
#   off           Open Food Facts mapping: nutriments field id, its unit, and the
#                 factor so that our value = OFF value x factor
#   eurofir       EuroFIR component code: filled in after P0-3 (ADR 0005)
#   usda          USDA FoodData Central nutrient id: filled in after P0-3 (ADR 0005)
#   note          optional remark
#
# Sources: EU label order and German wording from Regulation (EU) No 1169/2011,
# Annex XV (https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=celex%3A32011R1169).
# OFF field ids and units from the OFF API (/api/v2/product/<barcode>) and the
# OFF nutrients taxonomy, checked 2026-10-07.

version: 1

nutrients:
  - key: energy_kj
    unit: kJ
    label_de: "Energie"
    label_order: 10
    parent: null
    core: true
    mass_balance: false
    off: {field: energy-kj, unit: kJ, factor: 1}
    eurofir: null
    usda: null
    note: "Same label line as energy_kcal; kJ comes first."
  - key: energy_kcal
    unit: kcal
    label_de: "Energie"
    label_order: 11
    parent: null
    core: true
    mass_balance: false
    off: {field: energy-kcal, unit: kcal, factor: 1}
    eurofir: null
    usda: null
  - key: fat_g
